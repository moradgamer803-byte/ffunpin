plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zyvo.ffunpin'
    compileSdk 34

    defaultConfig {
        applicationId "com.zyvo.ffunpin"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    // extract libffunpin.so into /data/app/<pkg>/lib/arm64 at install time:
    // that domain is executable on Android 10+, an app-data copy is not
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
